[project]
name = "fast-api"
version = "0.1.0"
description = "API REST profesional con FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=44",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.2",
    "redis>=5.2",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "httpx>=0.28",
    "ruff>=0.9",
    "ty>=0.0.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    "alembic/versions",
    ".agents",
    ".claude",
    "GUIA_PROYECTO_FASTAPI.md",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
